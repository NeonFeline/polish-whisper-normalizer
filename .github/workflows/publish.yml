name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - name: Check if version already on PyPI
        id: check
        run: |
          PKG=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$PKG" >> $GITHUB_OUTPUT
          if uv run --with requests python -c "import sys, requests; r=requests.get(f'https://pypi.org/pypi/polish-whisper-normalizer/{sys.argv[1]}/json', timeout=10); sys.exit(0 if r.status_code==200 else 1)" "$PKG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PKG already on PyPI, will skip publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.exists == 'false'
        # uses trusted publishing — no token needed if configured on PyPI
        # fallback: set secret PYPI_API_TOKEN and uncomment below
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
