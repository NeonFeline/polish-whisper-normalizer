name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: uv sync --group dev --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - name: Check if version already on PyPI
        id: check
        run: |
          PKG=$(uv run python -c "import pathlib, re; text=pathlib.Path('pyproject.toml').read_text(); m=re.search(r'^\[project\][^\[]*?^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE|re.DOTALL); print(m.group(1) if m else '')")
          echo "version=$PKG" >> $GITHUB_OUTPUT
          if [ -z "$PKG" ]; then echo "exists=false" >> $GITHUB_OUTPUT; exit 0; fi
          if uv run python -c "import sys, urllib.request, json; import urllib.error; url=f'https://pypi.org/pypi/polish-whisper-normalizer/{sys.argv[1]}/json'; try: urllib.request.urlopen(url, timeout=10); sys.exit(0)\nexcept urllib.error.HTTPError as e: sys.exit(0 if e.code==200 else 1)\nexcept Exception: sys.exit(1)" "$PKG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PKG already on PyPI, will skip publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.exists == 'false'
        # uses trusted publishing — no token needed if configured on PyPI
        # fallback: set secret PYPI_API_TOKEN and uncomment below
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
