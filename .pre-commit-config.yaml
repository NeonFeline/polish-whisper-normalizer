repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [src]
        files: ^src/
        pass_filenames: false
        additional_dependencies: [types-regex]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: bump-patch-version
        name: bump patch version (0.1.2 -> 0.1.3)
        entry: python scripts/bump_patch.py
        language: system
        pass_filenames: false
        always_run: false
        verbose: false
        stages: [pre-commit]
        files: ^(src/|pyproject\.toml|README\.md)
