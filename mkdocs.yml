site_name: Polish Whisper Normalizer
site_description: Polish text normalizer for Whisper ASR (keeps diacritics, normalizes numbers/time/currency)
repo_url: https://github.com/NeonFeline/polish-whisper-normalizer
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - API: api.md
  - Changelog: changelog.md
