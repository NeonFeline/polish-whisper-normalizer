[project]
name = "polish-whisper-normalizer"
version = "0.1.8"
description = "Polish text normalizer for Whisper ASR output (keeps diacritics, normalizes numbers, time, currency)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["whisper", "asr", "polish", "normalization", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "NeonFeline", email = "maciejlachut77@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "regex",
    "morfeusz2",
]

[project.optional-dependencies]
jiwer = ["jiwer>=3.0"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.8",
    "pre-commit>=3.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ git = true }]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "morfeusz2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "regex.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jiwer.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
# allow non-critical SIM/RUF to be fixable without blocking CI
unfixable = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/polish_whisper_normalizer"]
branch = true
omit = ["src/polish_whisper_normalizer/jiwer.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise ImportError",
]

[project.urls]
Homepage = "https://github.com/NeonFeline/polish-whisper-normalizer"
Repository = "https://github.com/NeonFeline/polish-whisper-normalizer"
Issues = "https://github.com/NeonFeline/polish-whisper-normalizer/issues"
